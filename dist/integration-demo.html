<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mischief · Composer integration demo</title><link rel="stylesheet" href="style.css"><style>main{max-width:1120px}.demo-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.composer{padding:25px;border:1px solid #d5d7ca;border-radius:18px;background:white;align-self:start;position:sticky;top:20px}textarea{font:inherit;width:100%;min-height:100px;resize:vertical;border:1px solid #c8cfc0;border-radius:12px;padding:14px}.draft-stickers{display:flex;flex-wrap:wrap;gap:8px}.draft-stickers figure{margin:12px 0;width:130px}.draft-stickers img{width:120px;height:120px;object-fit:contain}.draft-stickers figcaption{font-size:12px;overflow-wrap:anywhere}.demo-note{font-size:14px;color:#65715a}@media(max-width:800px){.demo-layout{grid-template-columns:1fr}.composer{position:static;grid-row:1}}</style></head><body><main><p class="eyebrow">FOR APP BUILDERS</p><h1>Your composer.<br>More feeling.</h1><p>This sample brand embeds Mischief and receives each selected sticker with its meaning.</p><div class="demo-layout"><div id="kit"></div><section class="composer"><h2>Acme Chat · Draft</h2><label for="message">Your message</label><textarea id="message" placeholder="Write a message…"></textarea><div id="draft" class="draft-stickers" aria-live="polite"></div><p id="demoStatus" role="status" class="demo-note">Choose “Use this sticker” in the kit.</p><button id="clear" class="download">Clear draft stickers</button><p class="demo-note">Local demonstration. Nothing is sent to another person.</p><a href="integration.html">Integration guide ↗</a></section></div></main><script type="module">import {mountMischief} from './brand-sdk.mjs';const urls=[];mountMischief(document.getElementById('kit'),{brand:'Acme Chat',accent:'#b3d8ff',onSelect(sticker){const url=URL.createObjectURL(sticker.blob);urls.push(url);const figure=document.createElement('figure');const image=document.createElement('img');image.src=url;image.alt=sticker.alt;const caption=document.createElement('figcaption');caption.textContent=sticker.meaning.title;figure.append(image);document.getElementById('draft').append(figure);document.getElementById('demoStatus').textContent=(sticker.animated?'Animated':'Static')+' sticker added with accessible meaning.';}});document.getElementById('clear').onclick=()=>{urls.splice(0).forEach(url=>URL.revokeObjectURL(url));document.getElementById('draft').replaceChildren();document.getElementById('demoStatus').textContent='Draft stickers cleared.';};window.addEventListener('pagehide',()=>urls.forEach(url=>URL.revokeObjectURL(url)));</script></body></html>
