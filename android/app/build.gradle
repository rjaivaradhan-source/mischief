plugins { id 'com.android.application' }
android {
    namespace 'com.mischief.emojikit'
    compileSdk 35
    defaultConfig { applicationId 'com.mischief.emojikit'; minSdk 25; targetSdk 35; versionCode 2; versionName '0.2.0-preview' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    signingConfigs { debug { if (System.getenv('MISCHIEF_DEBUG_KEYSTORE')) { storeFile file(System.getenv('MISCHIEF_DEBUG_KEYSTORE')); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } } }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/mixerAssets')
}
tasks.register('syncMixer', Sync) {
    from('../../dist') { include 'special.js','special/**','catalog.js','composition.js','meaning.js','gif-worker.mjs','favicon.svg','vendor/**' }
    into layout.buildDirectory.dir('generated/mixerAssets')
}
tasks.named('preBuild').configure { dependsOn 'syncMixer' }
